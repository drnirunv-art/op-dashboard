<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>อีเมลแจ้งเตือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f6f7; --panel:#ffffff; --fg:#14262c; --muted:#5b6f76; --line:#d6e0e3;
  --accent:#0f7c9c; --accent-ink:#ffffff; --head:#ffe600; --head-ink:#1d1d00;
  --ok:#2e7d32; --bad:#c62828; --field:#fffbe0;
  --shadow:0 10px 30px rgba(20,38,44,.10);
  --f-body:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --ok:#7bd17f; --bad:#ff8a80; --field:#1f2d30;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --ok:#7bd17f; --bad:#ff8a80; --field:#1f2d30;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 110px}
h1{margin:0 0 4px;font-size:clamp(1.25rem,3vw,1.6rem)}
.lead{margin:0 0 16px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--head);color:var(--head-ink);vertical-align:middle;margin-left:6px}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.05rem}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=email],input[type=text]{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 11px}
input:read-only{background:transparent;border-style:dashed;color:var(--muted)}
input.err{border-color:var(--bad);outline:2px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.m{display:flex;gap:6px;align-items:center}
.m span{width:22px;text-align:right;color:var(--muted);font-size:13px;flex:none}
.x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:38px;cursor:pointer;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.add{margin-top:8px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .msg{margin-right:auto;font-size:14px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.state{padding:40px 8px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><p class="state">กำลังโหลด…</p></div>
</div>
<div class="bar" id="bar" hidden>
  <span class="msg" id="msg"></span>
  <button class="btn primary" id="save">บันทึก</button>
</div>

<script>
// LINE's in-app browser misbehaves with forms and files, so ask LINE to reopen the page in Chrome/Safari (once)
if (/ Line\//i.test(navigator.userAgent) && !new URLSearchParams(location.search).has("openExternalBrowser")) {
  // carry the key in the query too, in case LINE drops the #hash when it hands the page to Chrome/Safari
  const u = new URL(location.href), key = new URLSearchParams(u.hash.slice(1)).get("t");
  if (key){ u.searchParams.set("t", key); u.hash = ""; }
  u.searchParams.set("openExternalBrowser", "1"); location.replace(u.toString());
}
const API_URL = "https://script.google.com/macros/s/AKfycbyWGb4sbTMkBrBe7TKTmBSeVSEPuqXODlz6QcVOVh4eHnAl3jx8G4G7EiHtdBZYHqor/exec";
// the access key travels in the #hash so it never reaches GitHub's server logs
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || new URLSearchParams(location.search).get("t") || "";
const DEFAULT_ROWS = 8;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
let DATA = null, dirty = false;

async function apiGet(){
  const r = await fetch(API_URL + "?" + new URLSearchParams({ api: "alertsGet", t: TOKEN }), { credentials: "omit" });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}
async function apiSave(data){
  const r = await fetch(API_URL, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: "alertsSave", t: TOKEN, data }) });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}
function setMsg(text, kind){ $("msg").textContent = text; $("msg").className = "msg " + (kind || ""); }

function membersHtml(h){
  const list = h.members.slice();
  while (list.length < DEFAULT_ROWS) list.push("");
  return `<label class="f">3 · อีเมลลูกทีม (ไม่จำกัดจำนวน · กด + เพิ่มช่อง · กด ✕ ลบ · ช่องละ 1 อีเมล)</label>
    <div class="members" data-members="${esc(h.key)}">${list.map((m, i) => memberRow(m, i)).join("")}</div>
    <button class="btn add" data-add="${esc(h.key)}" type="button">+ เพิ่มช่องอีเมล</button>`;
}
const memberRow = (m, i) => `<div class="m"><span>${i + 1}</span><input type="email" inputmode="email" autocomplete="off" placeholder="name@example.com" value="${esc(m)}"><button class="x plus" type="button" title="เพิ่มอีเมลถัดจากช่องนี้" aria-label="เพิ่มอีเมลถัดจากช่องนี้">+</button><button class="x" type="button" title="ลบ" aria-label="ลบอีเมลนี้">✕</button></div>`;

function hospitalCard(h, admin){
  return `<section class="card" data-key="${esc(h.key)}">
    <h2>${esc(h.name)}</h2>
    <label class="f">2 · อีเมลกลุ่มของโรงนี้</label>
    <input type="email" class="group" inputmode="email" autocomplete="off" value="${esc(h.group)}" placeholder="${admin ? "เช่น tw-pt1@googlegroups.com" : "(ผู้ดูแลระบบเป็นผู้กำหนด)"}" ${admin ? "" : "readonly"}>
    ${membersHtml(h)}
  </section>`;
}

function render(){
  const admin = DATA.role === "admin";
  if (admin){
    document.title = "อีเมลแจ้งเตือน · ผู้ดูแลระบบ";
    $("app").innerHTML = `
      <h1>อีเมลแจ้งเตือน 12 โรงพยาบาล <span class="badge">ผู้ดูแลระบบ</span></h1>
      <p class="lead">ทุกวัน 16:00 ถ้าโรงไหนช่างยังไม่ได้บันทึกการตรวจ ระบบจะส่งอีเมลเตือนถึงอีเมลกลุ่มและลูกทีมของโรงนั้น และส่งสรุปรวมให้อีเมลในช่องที่ 1</p>
      <section class="card">
        <h2>1 · อีเมลรับสรุปรวมทั้ง 12 โรง</h2>
        <input type="text" id="summaryTo" inputmode="email" autocomplete="off" value="${esc(DATA.summaryTo)}" placeholder="dr.nirun.v@gmail.com">
        <p class="hint">ใส่ได้หลายอีเมล คั่นด้วยเครื่องหมาย ,</p>
      </section>
      ${DATA.hospitals.map(h => hospitalCard(h, true)).join("")}`;
  } else {
    const h = DATA.hospital;
    document.title = "อีเมลลูกทีม · " + h.name;
    $("app").innerHTML = `
      <h1>อีเมลลูกทีมรับแจ้งเตือน</h1>
      <p class="lead">ถ้าวันไหนยังไม่ได้บันทึกการตรวจ ระบบจะส่งอีเมลเตือนถึงทุกอีเมลด้านล่าง ใส่อีเมลของลูกทีม แล้วกด <b>บันทึก</b> ถ้ามีคนลาออก กด ✕ เพื่อลบออก</p>
      <section class="card">
        <h2>1 · อีเมลรับสรุปรวม (ผู้ดูแลระบบ)</h2>
        <input type="text" value="${esc(DATA.summaryTo)}" readonly>
      </section>
      ${hospitalCard(h, false)}`;
  }
  $("bar").hidden = false;
  dirty = false; setMsg("");
}

// add / remove member rows, track unsaved edits
document.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if (add){
    const box = document.querySelector(`[data-members="${add.dataset.add}"]`);
    box.insertAdjacentHTML("beforeend", memberRow("", box.children.length));
    box.lastElementChild.querySelector("input").focus();
    dirty = true; setMsg("ยังไม่ได้บันทึก");
    return;
  }
  const plus = e.target.closest(".plus");
  if (plus){
    const row = plus.closest(".m"), box = row.closest(".members");
    row.insertAdjacentHTML("afterend", memberRow("", 0));
    [...box.children].forEach((r, i) => r.querySelector("span").textContent = i + 1);
    row.nextElementSibling.querySelector("input").focus();
    dirty = true; setMsg("ยังไม่ได้บันทึก");
    return;
  }
  const x = e.target.closest(".x");
  if (x){
    const box = x.closest(".members"); x.closest(".m").remove();
    [...box.children].forEach((row, i) => row.querySelector("span").textContent = i + 1);
    dirty = true; setMsg("ยังไม่ได้บันทึก");
  }
});
document.addEventListener("input", e => { if (e.target.matches("input")){ e.target.classList.remove("err"); dirty = true; setMsg("ยังไม่ได้บันทึก"); } });
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

function collect(){
  let bad = 0;
  const check = el => { const v = el.value.trim(); if (v && !EMAIL_RE.test(v)){ el.classList.add("err"); bad++; } return v; };
  const hospitals = [...document.querySelectorAll("section[data-key]")].map(sec => ({
    key: sec.dataset.key,
    group: check(sec.querySelector(".group")),
    members: [...sec.querySelectorAll(".members input")].map(check).filter(Boolean)
  }));
  if (bad) throw new Error(`มีอีเมลที่รูปแบบไม่ถูกต้อง ${bad} ช่อง (กรอบสีแดง)`);
  if (DATA.role !== "admin") return { members: hospitals[0].members };
  const summaryTo = $("summaryTo").value.trim();
  summaryTo.split(/[\s,;]+/).filter(Boolean).forEach(x => { if (!EMAIL_RE.test(x)){ $("summaryTo").classList.add("err"); throw new Error("อีเมลรับสรุปรวมไม่ถูกต้อง: " + x); } });
  return { summaryTo, hospitals };
}
$("save").onclick = async () => {
  let data;
  try { data = collect(); } catch (e){ setMsg(e.message, "bad"); return; }
  const btn = $("save"); btn.disabled = true; btn.textContent = "กำลังบันทึก…"; setMsg("");
  try {
    DATA = await apiSave(data);
    render();
    setMsg("บันทึกแล้ว " + new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }), "ok");
  } catch (e){ setMsg("บันทึกไม่สำเร็จ: " + e.message, "bad"); }
  finally { btn.disabled = false; btn.textContent = "บันทึก"; }
};

(async () => {
  if (!TOKEN){ $("app").innerHTML = `<p class="state">ลิงก์ไม่ครบ กรุณาเปิดจากลิงก์ที่ได้รับ</p>`; return; }
  try { DATA = await apiGet(); render(); }
  catch (e){ $("app").innerHTML = `<p class="state">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
