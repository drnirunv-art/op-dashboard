<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>อีเมลกลุ่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f6f7; --panel:#ffffff; --fg:#14262c; --muted:#5b6f76; --line:#d6e0e3;
  --accent:#0f7c9c; --accent-ink:#ffffff; --head:#ffe600; --head-ink:#1d1d00;
  --ok:#2e7d32; --bad:#c62828; --field:#fffbe0;
  --shadow:0 10px 30px rgba(20,38,44,.10);
  --f-body:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --ok:#7bd17f; --bad:#ff8a80; --field:#1f2d30;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --ok:#7bd17f; --bad:#ff8a80; --field:#1f2d30;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 110px}
h1{margin:0 0 4px;font-size:clamp(1.25rem,3vw,1.6rem)}
.lead{margin:0 0 16px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--head);color:var(--head-ink);vertical-align:middle;margin-left:6px}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.05rem}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=email],input[type=text]{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 11px}
input:read-only{background:transparent;border-style:dashed;color:var(--muted)}
input.err{border-color:var(--bad);outline:2px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.grow{display:flex;gap:6px;align-items:center}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.m{display:flex;gap:6px;align-items:center}
.m span{width:22px;text-align:right;color:var(--muted);font-size:13px;flex:none}
.x{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:38px;cursor:pointer;flex:none}
.btn{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.add{margin-top:8px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.count{color:var(--muted);font-size:13px;font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.bar .msg{margin-right:auto;font-size:14px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.state{padding:40px 8px;text-align:center;color:var(--muted)}
.steps{margin:0 0 12px;padding-left:22px;display:grid;gap:4px}
.warn{background:color-mix(in srgb,var(--head) 22%,var(--panel));border-radius:9px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.done{border:1px solid var(--ok);border-radius:10px;padding:12px;margin-top:12px}
.done p{margin:0 0 10px}
a.btn{display:inline-block;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.grp h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--accent) 15%,var(--panel));color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.confirm{margin-top:10px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px}
.confirm p{margin:0 0 8px}
details.howto{margin-top:6px}
details.howto summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.howto ol{margin:8px 0 0;padding-left:22px;display:grid;gap:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.sep{height:1px;background:var(--line);margin:14px 0}
@media (max-width:520px){.grow{flex-wrap:wrap}.grow .btn{flex:1 1 auto}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><p class="state">กำลังโหลด…</p></div>
</div>
<div class="bar" id="bar" hidden><span class="msg" id="msg"></span></div>

<script>
// LINE's in-app browser misbehaves with forms, so ask LINE to reopen the page in Chrome/Safari (once)
if (/ Line\//i.test(navigator.userAgent) && !new URLSearchParams(location.search).has("openExternalBrowser")) {
  const u = new URL(location.href), key = new URLSearchParams(u.hash.slice(1)).get("t");
  if (key){ u.searchParams.set("t", key); u.hash = ""; }
  u.searchParams.set("openExternalBrowser", "1"); location.replace(u.toString());
}
const API_URL = "https://script.google.com/macros/s/AKfycbyJXDBgmbSBVP4aCgWqHAM1PE36dXZMWbG-Mh8m0DlLhtTgQZ6TxMZk1Ix4KJLiILaH/exec";
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || new URLSearchParams(location.search).get("t") || "";
const PAGE_URL = location.origin + location.pathname;
const DEFAULT_ROWS = 4;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EMAIL_RE = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
const GMAIL_RE = /^[a-z0-9.+_-]+@(gmail|googlemail)\.com$/i;
const GG_RE = /^([a-z0-9._-]+)@googlegroups\.com$/i;
const groupPage = g => { const m = GG_RE.exec(g || ""); return m ? "https://groups.google.com/g/" + m[1] : "https://groups.google.com/my-groups"; };
const joinUrl = (g, em) => groupPage(g) + "?authuser=" + encodeURIComponent(em);
const teamLink = token => PAGE_URL + "#t=" + token;
const remember = { get(){ try { return localStorage.getItem("eb_me") || ""; } catch { return ""; } }, set(v){ try { localStorage.setItem("eb_me", v); } catch {} } };
let DATA = null, dirty = false;
const draft = {
  get(){ try { return JSON.parse(localStorage.getItem("gm_draft") || "{}"); } catch { return {}; } },
  set(v){ try { localStorage.setItem("gm_draft", JSON.stringify(v)); } catch {} },
  clear(){ try { localStorage.removeItem("gm_draft"); } catch {} }
};
const PREFIX_RE = /^[a-z0-9][a-z0-9_-]{2,62}$/;
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
function claudePrompt(name, prefix){
  return `ช่วยสร้าง Google Group ใหม่ให้หน่อยครับ โดยใช้เบราว์เซอร์ในแอป Claude บนคอมพิวเตอร์ของผม
บัญชีที่ใช้สร้าง: dr.nirun.v@gmail.com (ถ้าเบราว์เซอร์ล็อกอินหลายบัญชี ให้เลือกบัญชีนี้ก่อน)
เริ่มที่หน้า https://groups.google.com/my-groups?create-group=1

ข้อมูลกลุ่ม
- Group name: ${name}
- Group email: ${prefix}@googlegroups.com
- Group description: อีเมลกลุ่ม ${name} รับเมลจากภายนอกแล้วส่งต่อถึงลูกทีม

ตั้งค่าความเป็นส่วนตัว
- Who can search for group: Anyone on the web
- Who can join group: Anyone can join
- Who can view conversations: Group members
- Who can post: Anyone on the web
- Who can view members: Group members

ไม่ต้องเพิ่มสมาชิก กรอกและตั้งค่าให้ครบจนถึงหน้าสุดท้าย แล้วหยุดรอให้ผมกด Create group และยืนยัน CAPTCHA เอง
ถ้าชื่ออีเมลกลุ่มนี้ถูกใช้ไปแล้ว ให้หยุดแล้วบอกผมก่อน อย่าเปลี่ยนชื่อเอง
หลังผมบอกว่าสร้างแล้ว ให้เปิดหน้า About ของกลุ่ม ตรวจว่าตั้งค่าตรงตามนี้ แล้วสรุปให้ผมฟัง
ห้ามแตะกลุ่มอื่นหรือระบบอื่นที่ไม่เกี่ยวข้อง`;
}
function wizardState(){
  const n = $("newName"), p = $("newPrefix");
  if (!n || !p) return null;
  return { name: n.value.trim(), prefix: p.value.trim().toLowerCase() };
}
function updateWizard(){
  const s = wizardState(); if (!s) return;
  draft.set(s);
  const ok = s.name && PREFIX_RE.test(s.prefix);
  const hint = $("prefixHint");
  if (!s.prefix) hint.textContent = "อีเมลกลุ่มเป็นภาษาอังกฤษเท่านั้น เช่น ชื่อกลุ่ม \"จัดซื้อ\" ใช้ purchasing-t";
  else if (!PREFIX_RE.test(s.prefix)) { hint.innerHTML = '<span style="color:var(--bad)">ใช้ได้เฉพาะ a-z, 0-9, ขีด - และ _ ยาว 3 ตัวขึ้นไป ห้ามมีจุดหรือเว้นวรรค</span>'; }
  else hint.innerHTML = `อีเมลกลุ่มจะเป็น <b class="mono">${esc(s.prefix)}@googlegroups.com</b>`;
  const a = $("askClaude");
  a.href = ok ? "https://claude.ai/new?q=" + encodeURIComponent(claudePrompt(s.name, s.prefix)) : "#";
  a.setAttribute("aria-disabled", ok ? "false" : "true");
  a.style.opacity = ok ? "" : ".55";
}


async function apiGet(){
  const r = await fetch(API_URL + "?" + new URLSearchParams({ api: "ebGet", t: TOKEN }), { credentials: "omit" });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}
async function apiPost(fn, data){
  const r = await fetch(API_URL, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, t: TOKEN, data }) });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}
function setMsg(text, kind){ $("bar").hidden = !text; $("msg").textContent = text; $("msg").className = "msg " + (kind || ""); }
const stamp = () => new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = "คัดลอกแล้ว"; setTimeout(() => btn.textContent = o, 1500); }
  catch { const i = btn.parentElement.querySelector("input"); if (i){ i.removeAttribute("readonly"); i.select(); i.setAttribute("readonly", ""); } setMsg("เลือกข้อความแล้ว กดคัดลอกเองได้เลย"); }
}
const memberRow = (m, i) => `<div class="m"><span>${i + 1}</span><input type="email" inputmode="email" autocomplete="off" placeholder="name@gmail.com" value="${esc(m)}"><button class="x plus" type="button" title="เพิ่มช่องถัดไป" aria-label="เพิ่มช่องถัดไป">+</button><button class="x del" type="button" title="ลบ" aria-label="ลบอีเมลนี้">✕</button></div>`;
function membersBox(id, members){
  const list = members.slice(); while (list.length < DEFAULT_ROWS) list.push("");
  return `<div class="members" data-members="${esc(id)}">${list.map(memberRow).join("")}</div>`;
}
function renumber(box){
  const rows = [...box.querySelectorAll(".m")];
  rows.forEach((r, i) => r.querySelector("span").textContent = i + 1);
  const c = box.closest("section").querySelector(".count");
  if (c) c.textContent = `(${rows.filter(r => r.querySelector("input").value.trim()).length} คน)`;
}
function readMembers(box){
  let bad = 0;
  const out = [...box.querySelectorAll("input")].map(el => {
    const v = el.value.trim().toLowerCase();
    if (v && !GMAIL_RE.test(v)){ el.classList.add("err"); bad++; }
    return v;
  }).filter(Boolean);
  if (bad) throw new Error(`ใช้ได้เฉพาะ Gmail (@gmail.com) มี ${bad} ช่องที่ไม่ถูกต้อง (กรอบสีแดง)`);
  const seen = new Set(), dup = out.filter(m => seen.has(m) || !seen.add(m));
  if (dup.length) throw new Error("มีอีเมลซ้ำ: " + dup.join(", "));
  return out;
}

/* ---------- team view (one group) ---------- */
function renderTeam(){
  const g = DATA.group;
  document.title = "อีเมลกลุ่ม " + g.name;
  $("app").innerHTML = `
    <h1>อีเมลกลุ่ม ${esc(g.name)}</h1>
    <p class="lead">คนภายนอกส่งเมลมาที่อีเมลหลักของกลุ่ม แล้วเมลจะส่งถึงลูกทีมทุกคนที่เข้าร่วมกลุ่มแล้วโดยอัตโนมัติ</p>
    <section class="card">
      <h2>1 · อีเมลหลักของกลุ่ม (Google Group)</h2>
      <div class="grow"><input type="text" id="gmail-main" value="${esc(g.group)}" readonly><button class="btn" data-copy="${esc(g.group)}" type="button">คัดลอก</button></div>
      <p class="hint">ผู้ดูแลระบบเป็นผู้กำหนด</p>
    </section>
    <section class="card">
      <h2>2 · ลงทะเบียนและเข้าร่วมกลุ่ม (ลูกทีมทุกคนต้องทำ)</h2>
      <ol class="steps">
        <li>กรอก <b>Gmail ของคุณ</b> แล้วกด <b>บันทึกและเข้าร่วมกลุ่ม</b></li>
        <li>กดปุ่ม <b>เปิดหน้าเข้าร่วมกลุ่ม</b> ที่จะขึ้นมา</li>
        <li>ในหน้า Google Groups กด <b>เข้าร่วมกลุ่ม / Join group</b> แล้วกดยืนยัน</li>
      </ol>
      <label class="f" for="me">Gmail ของคุณ (ต้องลงท้ายด้วย @gmail.com เท่านั้น)</label>
      <div class="grow">
        <input type="email" id="me" inputmode="email" autocomplete="email" placeholder="yourname@gmail.com" value="${esc(remember.get())}">
        <button class="btn primary" id="join" type="button">บันทึกและเข้าร่วมกลุ่ม</button>
      </div>
      <div id="joinBox" hidden></div>
      <p class="warn"><b>สำคัญ:</b> ก่อนกด Join group ให้ดูรูปโปรไฟล์มุมขวาบนของหน้า Google Groups ว่าเป็น Gmail เดียวกับที่กรอกไว้ ถ้าไม่ใช่ ให้กดรูปโปรไฟล์แล้วเปลี่ยนบัญชีก่อน ไม่อย่างนั้นเมลจะไปเข้าบัญชีอื่น</p>
    </section>
    <section class="card">
      <h2>3 · รายชื่อลูกทีมที่ลงทะเบียนแล้ว <span class="count"></span></h2>
      <label class="f">Gmail เท่านั้น · กด + เพิ่มช่อง · กด ✕ ลบ · ช่องละ 1 อีเมล</label>
      ${membersBox(g.id, g.members)}
      <div class="row"><button class="btn add" data-add="${esc(g.id)}" type="button">+ เพิ่มช่องอีเมล</button><button class="btn primary" data-save="${esc(g.id)}" type="button">บันทึกรายชื่อ</button></div>
    </section>`;
  document.querySelectorAll(".members").forEach(renumber);
  dirty = false;
}
async function doJoin(){
  const el = $("me"), em = el.value.trim().toLowerCase();
  if (!GMAIL_RE.test(em)){ el.classList.add("err"); el.focus(); setMsg("กรุณากรอก Gmail ที่ลงท้ายด้วย @gmail.com", "bad"); return; }
  const g = DATA.group;
  const box = document.querySelector(".members");
  let members;
  try { members = readMembers(box); } catch (e){ setMsg(e.message, "bad"); return; }
  if (!members.includes(em)) members.push(em);
  const btn = $("join"); btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  try {
    DATA = await apiPost("ebSave", { members });
    remember.set(em);
    renderTeam();
    $("me").value = em;
    const jb = $("joinBox"); jb.hidden = false; jb.className = "done";
    jb.innerHTML = `<p>บันทึก <b>${esc(em)}</b> แล้ว ขั้นต่อไปกดปุ่มนี้ แล้วกด <b>Join group</b> ในหน้าที่เปิดขึ้นมา</p>
      <a class="btn primary" href="${esc(joinUrl(g.group, em))}" target="_blank" rel="noopener">เปิดหน้าเข้าร่วมกลุ่ม</a>`;
    setMsg("บันทึกแล้ว " + stamp(), "ok");
    jb.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e){ setMsg("บันทึกไม่สำเร็จ: " + e.message, "bad"); }
  finally { const b = $("join"); if (b){ b.disabled = false; b.textContent = "บันทึกและเข้าร่วมกลุ่ม"; } }
}

/* ---------- admin view (all groups) ---------- */
function adminGroupCard(g){
  const link = teamLink(g.token);
  return `<section class="card grp" data-gid="${esc(g.id)}">
    <h2>${esc(g.name)} <span class="chip">${g.members.length} คนลงทะเบียน</span></h2>
    <label class="f">ลิงก์สำหรับลูกทีม (ส่งลิงก์นี้ให้ทีม ${esc(g.name)})</label>
    <div class="grow"><input type="text" class="mono" value="${esc(link)}" readonly><button class="btn primary" data-copy="${esc(link)}" type="button">คัดลอกลิงก์</button></div>
    <div class="row">
      <div style="flex:1 1 200px;min-width:0"><label class="f">ชื่อกลุ่ม</label><input type="text" class="g-name" value="${esc(g.name)}"></div>
      <div style="flex:2 1 260px;min-width:0"><label class="f">อีเมลหลัก (Google Group)</label><input type="email" class="g-mail" value="${esc(g.group)}"></div>
    </div>
    <p class="hint"><a href="${esc(groupPage(g.group))}/members" target="_blank" rel="noopener">เปิดรายชื่อสมาชิกจริงใน Google Groups</a> · ใช้เทียบว่าใครกด Join group แล้ว</p>
    <label class="f">ลูกทีมที่ลงทะเบียน <span class="count"></span></label>
    ${membersBox(g.id, g.members)}
    <div class="row">
      <button class="btn add" data-add="${esc(g.id)}" type="button">+ เพิ่มช่องอีเมล</button>
      <button class="btn primary" data-save="${esc(g.id)}" type="button">บันทึกกลุ่มนี้</button>
      <button class="btn danger" data-del="${esc(g.id)}" type="button" style="margin-left:auto">ลบกลุ่มนี้</button>
    </div>
    <div class="confirm" data-confirm="${esc(g.id)}" hidden>
      <p>ลบกลุ่ม <b>${esc(g.name)}</b> ออกจากหน้านี้? ลิงก์ลูกทีมของกลุ่มนี้จะใช้ไม่ได้ทันที (Google Group จริงไม่ถูกลบ)</p>
      <div class="row" style="margin:0"><button class="btn danger solid" data-delyes="${esc(g.id)}" type="button">ยืนยันลบ</button><button class="btn" data-delno="${esc(g.id)}" type="button">ยกเลิก</button></div>
    </div>
  </section>`;
}
function renderAdmin(){
  document.title = "จัดการอีเมลกลุ่ม · ผู้ดูแลระบบ";
  $("app").innerHTML = `
    <h1>จัดการอีเมลกลุ่ม <span class="badge">ผู้ดูแลระบบ</span></h1>
    <p class="lead">ลิงก์นี้สำหรับคุณคนเดียว ห้ามส่งต่อ · แต่ละกลุ่มมีลิงก์ลูกทีมของตัวเอง ลูกทีมกลุ่มหนึ่งจะไม่เห็นกลุ่มอื่น</p>
    <section class="card">
      <h2>เพิ่มกลุ่มใหม่</h2>
      <p class="hint" style="margin:0 0 6px"><b>ขั้นที่ 1 ·</b> ตั้งชื่อกลุ่มและอีเมลกลุ่ม</p>
      <div class="row" style="margin-top:0">
        <div style="flex:1 1 200px;min-width:0"><label class="f" for="newName">ชื่อกลุ่ม</label><input type="text" id="newName" placeholder="เช่น จัดซื้อ" value="${esc(draft.get().name)}"></div>
        <div style="flex:2 1 260px;min-width:0"><label class="f" for="newPrefix">อีเมลกลุ่ม (a-z, 0-9, ขีด - เท่านั้น ห้ามมีจุด)</label>
          <div class="grow"><input type="text" id="newPrefix" class="mono" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="เช่น purchasing-t" value="${esc(draft.get().prefix)}" ${draft.get().prefix ? 'data-touched="1"' : ""}><span class="hint" style="margin:0;white-space:nowrap">@googlegroups.com</span></div>
        </div>
      </div>
      <p class="hint" id="prefixHint"></p>
      <div class="sep"></div>
      <p class="hint" style="margin:0 0 6px"><b>ขั้นที่ 2 ·</b> สร้าง Google Group (เลือกทางใดทางหนึ่ง)</p>
      <div class="row" style="margin-top:0">
        <a class="btn primary" id="askClaude" href="#" target="_blank" rel="noopener">ให้ Claude สร้างกลุ่มให้</a>
        <button class="btn" id="copyPrompt" type="button">คัดลอกข้อความสั่ง Claude</button>
      </div>
      <p class="hint">ทาง A · กดแล้วกด <b>ส่ง</b> ในแชท Claude ที่เปิดขึ้น · คอมพิวเตอร์ต้องเปิดแอป Claude ไว้ · สุดท้ายคุณกด Create group + ยืนยัน CAPTCHA ที่คอมพิวเตอร์เอง</p>
      <details class="howto">
        <summary>ทาง B · สร้างเองทีละขั้น (กดเพื่อดู)</summary>
        <div class="row">
          <a class="btn" href="https://groups.google.com/my-groups?create-group=1" target="_blank" rel="noopener">เปิดหน้าสร้างกลุ่ม</a>
          <button class="btn" id="copyName" type="button">คัดลอกชื่อกลุ่ม</button>
          <button class="btn" id="copyPrefix" type="button">คัดลอกอีเมลกลุ่ม</button>
        </div>
        <ol>
          <li>ตรวจว่ารูปโปรไฟล์มุมขวาบนเป็น <b>dr.nirun.v@gmail.com</b></li>
          <li>วางชื่อกลุ่มในช่อง Group name และวางอีเมลกลุ่มในช่อง Group email → กด Next</li>
          <li>Who can search for group = <b>Anyone on the web</b></li>
          <li>Who can join group = <b>Anyone can join</b></li>
          <li>Who can view conversations = <b>Group members</b></li>
          <li>Who can post = <b>Anyone on the web</b> (ให้คนนอกส่งเมลเข้ามาได้)</li>
          <li>กด Next → ไม่ต้องใส่สมาชิก → กด Create group → ยืนยันว่าไม่ใช่โปรแกรมอัตโนมัติ</li>
        </ol>
      </details>
      <div class="sep"></div>
      <p class="hint" style="margin:0 0 6px"><b>ขั้นที่ 3 ·</b> สร้างกลุ่มใน Google เสร็จแล้ว กดปุ่มนี้เพื่อรับลิงก์ลูกทีม</p>
      <div class="row" style="margin-top:0"><button class="btn primary" id="addGroup" type="button">สร้างเสร็จแล้ว เพิ่มเข้าระบบ</button></div>
    </section>
    ${DATA.groups.length ? DATA.groups.map(adminGroupCard).join("") : '<p class="state">ยังไม่มีกลุ่ม เพิ่มกลุ่มแรกด้านบนได้เลย</p>'}`;
  document.querySelectorAll(".members").forEach(renumber);
  updateWizard();
  dirty = false;
}
const render = () => DATA.role === "admin" ? renderAdmin() : renderTeam();
function flash(id){ const s = document.querySelector(`[data-gid="${CSS.escape(id)}"]`); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); }

async function saveGroup(id, btn){
  const sec = btn.closest("section"), box = sec.querySelector(".members");
  let data;
  try {
    data = { id, members: readMembers(box) };
    if (DATA.role === "admin"){
      const n = sec.querySelector(".g-name"), m = sec.querySelector(".g-mail");
      data.name = n.value.trim(); data.group = m.value.trim().toLowerCase();
      if (!data.name){ n.classList.add("err"); throw new Error("กรุณาใส่ชื่อกลุ่ม"); }
      if (!EMAIL_RE.test(data.group)){ m.classList.add("err"); throw new Error("อีเมลหลักของกลุ่มไม่ถูกต้อง"); }
    }
  } catch (e){ setMsg(e.message, "bad"); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  try { DATA = await apiPost("ebSave", data); render(); setMsg("บันทึกแล้ว " + stamp(), "ok"); if (DATA.role === "admin") flash(id); }
  catch (e){ setMsg("บันทึกไม่สำเร็จ: " + e.message, "bad"); btn.disabled = false; btn.textContent = label; }
}
async function addGroup(btn){
  const s = wizardState();
  if (!s.name){ $("newName").classList.add("err"); setMsg("กรุณาใส่ชื่อกลุ่ม", "bad"); return; }
  if (!PREFIX_RE.test(s.prefix)){ $("newPrefix").classList.add("err"); setMsg("อีเมลกลุ่มไม่ถูกต้อง (a-z, 0-9, ขีด - ห้ามมีจุด)", "bad"); return; }
  const name = s.name, group = s.prefix + "@googlegroups.com";
  btn.disabled = true; btn.textContent = "กำลังเพิ่ม…";
  try { DATA = await apiPost("gmAdd", { name, group }); draft.clear(); render(); setMsg(`เพิ่มกลุ่ม ${name} แล้ว คัดลอกลิงก์ลูกทีมได้เลย`, "ok"); flash(DATA.added); }
  catch (e){ setMsg("เพิ่มไม่สำเร็จ: " + e.message, "bad"); btn.disabled = false; btn.textContent = "สร้างเสร็จแล้ว เพิ่มเข้าระบบ"; }
}
async function deleteGroup(id, btn){
  btn.disabled = true; btn.textContent = "กำลังลบ…";
  try { DATA = await apiPost("gmDelete", { id }); render(); setMsg("ลบกลุ่มแล้ว", "ok"); }
  catch (e){ setMsg("ลบไม่สำเร็จ: " + e.message, "bad"); btn.disabled = false; btn.textContent = "ยืนยันลบ"; }
}

document.addEventListener("click", e => {
  const ac = e.target.closest("#askClaude");
  if (ac && ac.getAttribute("aria-disabled") === "true"){ e.preventDefault(); setMsg("กรอกชื่อกลุ่มและอีเมลกลุ่มให้ถูกต้องก่อน", "bad"); return; }
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "copyName" || t.id === "copyPrefix" || t.id === "copyPrompt"){
    const s = wizardState();
    if (!s.name || !PREFIX_RE.test(s.prefix)){ setMsg("กรอกชื่อกลุ่มและอีเมลกลุ่มให้ถูกต้องก่อน", "bad"); return; }
    copy(t.id === "copyName" ? s.name : t.id === "copyPrefix" ? s.prefix : claudePrompt(s.name, s.prefix), t); return;
  }
  if (t.dataset.copy !== undefined){ copy(t.dataset.copy, t); return; }
  if (t.id === "join"){ doJoin(); return; }
  if (t.id === "addGroup"){ addGroup(t); return; }
  if (t.dataset.save){ saveGroup(t.dataset.save, t); return; }
  if (t.dataset.del){ document.querySelector(`[data-confirm="${CSS.escape(t.dataset.del)}"]`).hidden = false; return; }
  if (t.dataset.delno){ document.querySelector(`[data-confirm="${CSS.escape(t.dataset.delno)}"]`).hidden = true; return; }
  if (t.dataset.delyes){ deleteGroup(t.dataset.delyes, t); return; }
  if (t.dataset.add){
    const box = t.closest("section").querySelector(".members");
    box.insertAdjacentHTML("beforeend", memberRow("", box.children.length));
    box.lastElementChild.querySelector("input").focus();
    renumber(box); dirty = true; setMsg("ยังไม่ได้บันทึก"); return;
  }
  if (t.classList.contains("plus")){
    const row = t.closest(".m"), box = row.closest(".members");
    row.insertAdjacentHTML("afterend", memberRow("", 0));
    row.nextElementSibling.querySelector("input").focus();
    renumber(box); dirty = true; setMsg("ยังไม่ได้บันทึก"); return;
  }
  if (t.classList.contains("del")){
    const box = t.closest(".members"); t.closest(".m").remove(); renumber(box); dirty = true; setMsg("ยังไม่ได้บันทึก");
  }
});
document.addEventListener("input", e => {
  if (!e.target.matches("input")) return;
  e.target.classList.remove("err");
  if (e.target.id === "newName"){ const p = $("newPrefix"); if (!p.dataset.touched){ const sg = slug(e.target.value); p.value = sg ? sg + "-t" : ""; } }
  if (e.target.id === "newPrefix") e.target.dataset.touched = "1";
  if (e.target.id === "newName" || e.target.id === "newPrefix"){ updateWizard(); return; }
  if (e.target.id !== "me"){ dirty = true; setMsg("ยังไม่ได้บันทึก"); }
  const box = e.target.closest(".members"); if (box) renumber(box);
});
window.addEventListener("hashchange", () => location.reload());
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

(async () => {
  if (!TOKEN){ $("app").innerHTML = `<p class="state">ลิงก์ไม่ครบ กรุณาเปิดจากลิงก์ที่ได้รับ</p>`; return; }
  try { DATA = await apiGet(); render(); }
  catch (e){ $("app").innerHTML = `<p class="state">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
