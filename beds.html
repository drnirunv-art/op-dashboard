<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Functional Beds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2733;--muted:#6b7684;--line:#e3e7ee;--blue:#2563eb;--blue2:#dbe7ff;--green:#16a34a;--green2:#dcfce7;--red:#dc2626;--red2:#fee2e2;--amber:#b45309;--amber2:#fef3c7;--purple2:#e6e3f7}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:13px;opacity:.85}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.bar input,.bar select,.bar button{font:inherit;padding:7px 10px;border-radius:8px;border:0}
.bar button{background:#fff;color:#1e3a8a;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:#fff;color:#1e3a8a;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:14px 16px 110px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700}
.kpi.pts{background:var(--green2)} .kpi.ps2{background:var(--purple2)} .kpi.tot{background:#fbf7d6} .kpi.cl{background:var(--amber2)}
.status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.s-ok{background:var(--green2);color:var(--green)} .s-no{background:var(--amber2);color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ward{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ward.warn{border-color:var(--red);box-shadow:0 0 0 2px var(--red2)}
.ward .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ward .name{font-weight:700;font-size:16px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--blue2);color:var(--blue);font-weight:600}
.badge.ex{background:#eee;color:#666}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 8px}
.fields label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.fields input{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fbfcfe}
.fields input:focus{outline:2px solid var(--blue2);border-color:var(--blue)}
.fields input.req{background:#fffbe8}
.calc{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.calc b{font-size:15px}
.red{color:var(--red)!important}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:6}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:#eef2f8;color:var(--ink)}
.btn:disabled{opacity:.5}
.msg{font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
th{background:#eef2f8;font-size:12px;color:var(--muted);font-weight:600}
td.l,th.l{text-align:left}
tr.click{cursor:pointer} tr.click:hover td{background:#f6f9ff}
tr.sel td{background:var(--blue2)}
.wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
h2{font-size:16px;margin:18px 0 8px}
.trend{display:flex;align-items:flex-end;gap:4px;height:150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 10px 26px;overflow-x:auto}
.trend .c{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.trend .b{width:70%;background:var(--blue);border-radius:4px 4px 0 0}
.trend .t{font-size:10px;margin-bottom:2px}
.trend .d{position:absolute;bottom:-20px;font-size:10px;color:var(--muted);white-space:nowrap}
.set td input,.set td select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;width:100%}
.hide{display:none}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 id="title">Functional Beds</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <input type="date" id="date">
    <button id="reload">โหลดข้อมูล</button>
    <span id="stat"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="loading">กำลังโหลด...</div></main>
<div class="savebar hide" id="savebar"><span class="msg" id="msg"></span><button class="btn" id="save">บันทึกข้อมูลวันนี้</button></div>
<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyYtbn87iQjK2qkcmNzVPIXfaupD36S0ygXVp0Kvw21p3xwoBdffTAKZtaa_JNRPT9lsg/exec";
var Q = new URLSearchParams(location.search);
var BOOT = { mode: Q.get('view')==='admin'?'admin':'entry', code: Q.get('h')||'', token: Q.get('t')||'' };
var $ = function(id){return document.getElementById(id)};
var state = {rows:[], wards:[], view:'entry', sel:null};
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function pct(a,b){return b>0?(a/b*100).toFixed(2)+'%':'-'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function call(fn){var args=[].slice.call(arguments,1);return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error);return j.data})}
function thDate(s){var p=s.split('-');var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return (+p[2])+' '+m[+p[1]-1]+' '+p[0]}
function calc(r){var usable=num(r.ready)-num(r.repair)-num(r.renovate);var remain=num(r.ready)-num(r.census)-num(r.repair)-num(r.renovate);return {usable:usable,remain:remain,rate:usable>0?num(r.census)/usable:(num(r.census)>0?Infinity:0)}}
function totals(rows,b){var t={ready:0,census:0,usable:0,remain:0,repair:0,renovate:0};rows.forEach(function(r){if(r.include==='ไม่')return;if(b&&r.building!==b)return;var c=calc(r);t.ready+=num(r.ready);t.census+=num(r.census);t.usable+=c.usable;t.remain+=c.remain;t.repair+=num(r.repair);t.renovate+=num(r.renovate)});return t}

$('reload').onclick = function(){ BOOT.mode==='admin'?loadOverview():loadDay(); };
$('date').onchange = $('reload').onclick;

// ================= ENTRY MODE =================
function initEntry(){
  $('title').textContent = 'กรอกข้อมูลเตียงประจำวัน';
  $('sub').textContent = BOOT.name + ' · ข้อมูล ณ 7.00 น.';
  $('tabs').innerHTML = '<button class="on" data-v="entry">กรอกรายวัน</button><button data-v="set">ตั้งค่า Ward ประจำ</button>';
  $('tabs').onclick = function(e){var v=e.target.getAttribute('data-v');if(!v)return;[].forEach.call($('tabs').children,function(b){b.classList.toggle('on',b===e.target)});state.view=v;v==='entry'?loadDay():loadWards()};
  $('save').onclick = saveDay;
  loadDay();
}
function loadDay(){
  state.view='entry';
  $('main').innerHTML='<div class="loading">กำลังโหลด...</div>';
  $('savebar').classList.remove('hide'); $('save').textContent='บันทึกข้อมูลวันที่ '+thDate($('date').value); $('msg').textContent='';
  call('getDay',BOOT.code,BOOT.token,$('date').value).then(function(d){
    state.rows=d.rows;
    $('stat').innerHTML = d.saved?'<span class="status s-ok">บันทึกแล้ว · แก้ไขแล้วกดบันทึกซ้ำได้</span>':'<span class="status s-no">ยังไม่บันทึก</span>';
    renderEntry();
  }).catch(err);
}
function renderEntry(){
  if(!state.rows.length){$('main').innerHTML='<div class="loading">ยังไม่มีรายชื่อ Ward ประจำ กรุณาไปที่แท็บ "ตั้งค่า Ward ประจำ" เพื่อเพิ่ม Ward ของโรงพยาบาลก่อน</div>';$('savebar').classList.add('hide');return}
  var h='<div class="kpis" id="kpis"></div><div class="grid">';
  state.rows.forEach(function(r,i){
    h+='<div class="ward" id="w'+i+'"><div class="top"><span class="name">'+esc(r.ward)+'</span><span><span class="badge">'+esc(r.building)+'</span> '+(r.include==='ไม่'?'<span class="badge ex">ไม่นับรวม</span>':'')+'</span></div>'+
    '<div class="fields">'+
    f(i,'ready','เตียงพร้อมรับ (มีเตียง มีเครื่องมือ)',r.ready,'')+
    f(i,'census','ครองเตียง ณ 7 น.',r.census,'req')+
    f(i,'repair','เตียงปิดซ่อม',r.repair,'')+
    f(i,'renovate','เตียงปิด Renovate',r.renovate,'')+
    '<label style="grid-column:1/3">ห้องซ่อม/Renovate (เลขห้อง)<input data-i="'+i+'" data-k="room" value="'+esc(r.room)+'" placeholder="เช่น 1109"></label>'+
    '</div><div class="calc" id="c'+i+'"></div></div>';
  });
  h+='</div>';
  $('main').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.fields input'),function(inp){inp.oninput=function(){var i=+inp.getAttribute('data-i');state.rows[i][inp.getAttribute('data-k')]=inp.value;upd(i);kpis()}});
  state.rows.forEach(function(r,i){upd(i)}); kpis();
}
function f(i,k,label,v,cls){return '<label>'+label+'<input class="'+cls+'" type="number" inputmode="numeric" min="0" data-i="'+i+'" data-k="'+k+'" value="'+esc(v)+'"></label>'}
function upd(i){var r=state.rows[i],c=calc(r);var bad=c.rate>1||c.remain<0;$('w'+i).classList.toggle('warn',bad);
  $('c'+i).innerHTML='<span>ใช้งานได้ <b>'+c.usable+'</b></span><span>%Func <b class="'+(c.rate>1?'red':'')+'">'+(isFinite(c.rate)?(c.rate*100).toFixed(2)+'%':'เกิน')+'</b></span><span>เหลือ <b class="'+(c.remain<0?'red':'')+'">'+c.remain+'</b></span>'}
function kpis(){var t=totals(state.rows),p=totals(state.rows,'PTS'),s=totals(state.rows,'PS2');
  var bs={};state.rows.forEach(function(r){bs[r.building]=1});var names=Object.keys(bs).filter(function(x){return x});
  var h='<div class="kpi tot"><div class="l">Total Functional bed</div><div class="v">'+t.usable+'</div><div class="l">ครองเตียง '+t.census+' · '+pct(t.census,t.usable)+'</div></div>';
  if(names.length>1)names.forEach(function(b,ix){var x=totals(state.rows,b);h+='<div class="kpi '+(ix%2?'ps2':'pts')+'"><div class="l">'+esc(b)+' Functional bed</div><div class="v">'+x.usable+'</div><div class="l">ครองเตียง '+x.census+' · '+pct(x.census,x.usable)+'</div></div>'});
  h+='<div class="kpi"><div class="l">เหลือเตียงพร้อมรับ</div><div class="v">'+t.remain+'</div><div class="l">ว่าง '+pct(t.remain,t.usable)+'</div></div>';
  h+='<div class="kpi cl"><div class="l">เตียงปิดซ่อม / Renovate</div><div class="v">'+t.repair+' / '+t.renovate+'</div><div class="l">รวม '+(t.repair+t.renovate)+' เตียง</div></div>';
  $('kpis').innerHTML=h}
function saveDay(){
  var miss=state.rows.filter(function(r){return r.census===''||r.census==null}).length;
  if(miss&&!confirm('ยังไม่ได้กรอกครองเตียง '+miss+' Ward (จะบันทึกเป็น 0) ต้องการบันทึกต่อหรือไม่?'))return;
  $('save').disabled=true;$('msg').textContent='กำลังบันทึก...';
  call('saveDay',BOOT.code,BOOT.token,$('date').value,state.rows).then(function(r){$('save').disabled=false;$('msg').innerHTML='<span class="status s-ok">บันทึกแล้ว '+r.count+' Ward</span>';$('stat').innerHTML='<span class="status s-ok">บันทึกแล้ว · '+esc(r.at)+'</span>'}).catch(function(e){$('save').disabled=false;err(e)});
}
// ---- ward settings ----
function loadWards(){
  $('savebar').classList.add('hide');$('stat').innerHTML='';
  $('main').innerHTML='<div class="loading">กำลังโหลด...</div>';
  call('getWards',BOOT.code,BOOT.token).then(function(w){state.wards=w.length?w:[{ward:'',building:'',ready:0,include:'ใช่'}];renderWards()}).catch(err);
}
function renderWards(){
  var h='<h2>รายชื่อ Ward ประจำของ '+esc(BOOT.name)+'</h2><p class="msg" style="color:var(--muted)">ตั้งครั้งเดียว ใช้เป็นแบบฟอร์มกรอกทุกวัน · NSY, NICU ให้เลือก "ไม่" ในช่องนับรวม</p><div class="wrap"><table class="set"><tr><th>#</th><th class="l">Ward</th><th>อาคาร/โซน</th><th>เตียงพร้อมรับ (ประจำ)</th><th>นับรวมใน Total</th><th></th></tr>';
  state.wards.forEach(function(w,i){h+='<tr><td>'+(i+1)+'</td><td><input data-i="'+i+'" data-k="ward" value="'+esc(w.ward)+'"></td><td><input data-i="'+i+'" data-k="building" value="'+esc(w.building)+'" placeholder="เช่น อาคาร A"></td><td><input type="number" min="0" data-i="'+i+'" data-k="ready" value="'+esc(w.ready)+'"></td><td><select data-i="'+i+'" data-k="include"><option'+(w.include!=='ไม่'?' selected':'')+'>ใช่</option><option'+(w.include==='ไม่'?' selected':'')+'>ไม่</option></select></td><td><button class="btn sec" data-del="'+i+'" style="padding:6px 10px">ลบ</button></td></tr>'});
  h+='</table></div><button class="btn sec" id="add">+ เพิ่ม Ward</button> <button class="btn" id="sw">บันทึกรายชื่อ Ward</button> <span class="msg" id="wmsg"></span>';
  $('main').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.set input,.set select'),function(el){el.onchange=el.oninput=function(){state.wards[+el.getAttribute('data-i')][el.getAttribute('data-k')]=el.value}});
  [].forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){state.wards.splice(+b.getAttribute('data-del'),1);renderWards()}});
  $('add').onclick=function(){state.wards.push({ward:'',building:'',ready:0,include:'ใช่'});renderWards()};
  $('sw').onclick=function(){$('sw').disabled=true;$('wmsg').textContent='กำลังบันทึก...';call('saveWards',BOOT.code,BOOT.token,state.wards).then(function(w){state.wards=w;renderWards();$('wmsg').innerHTML='<span class="status s-ok">บันทึกแล้ว '+w.length+' Ward</span>'}).catch(err)};
}

// ================= ADMIN MODE =================
function initAdmin(){
  $('title').textContent='%Utilization Functional Beds · ภาพรวม 12 โรงพยาบาล';
  $('sub').textContent='เตียงที่พร้อมให้บริการ ไม่นับรวม NSY, NICU · ข้อมูล ณ 7.00 น.';
  loadOverview();
}
function loadOverview(){
  $('main').innerHTML='<div class="loading">กำลังโหลด...</div>';
  Promise.all([call('getOverview',BOOT.token,$('date').value),call('getTrend',BOOT.token,'',$('date').value,14)]).then(function(res){state.ov=res[0];state.trend=res[1];renderAdmin()}).catch(err);
}
function renderAdmin(){
  var all=[];state.ov.forEach(function(h){all=all.concat(h.rows)});
  var t=totals(all);var done=state.ov.filter(function(h){return h.rows.length}).length;
  $('stat').innerHTML='<span class="status '+(done===12?'s-ok':'s-no')+'">กรอกแล้ว '+done+'/12 โรง</span>';
  var h='<div class="kpis"><div class="kpi tot"><div class="l">Functional bed รวม '+done+' โรง</div><div class="v">'+t.usable+'</div></div><div class="kpi pts"><div class="l">ครองเตียง ณ 7 น.</div><div class="v">'+t.census+'</div></div><div class="kpi ps2"><div class="l">%Functional Bed</div><div class="v">'+pct(t.census,t.usable)+'</div></div><div class="kpi"><div class="l">เหลือเตียงพร้อมรับ</div><div class="v">'+t.remain+'</div><div class="l">ว่าง '+pct(t.remain,t.usable)+'</div></div><div class="kpi cl"><div class="l">ปิดซ่อม / Renovate</div><div class="v">'+t.repair+' / '+t.renovate+'</div></div></div>';
  h+='<h2>%Functional Bed 14 วันล่าสุด (รวม 12 โรง)</h2>'+trendHtml(state.trend);
  h+='<h2>สรุปรายโรงพยาบาล วันที่ '+thDate($('date').value)+' <span style="font-weight:400;color:var(--muted);font-size:13px">(กดที่ชื่อโรงเพื่อดูรายละเอียด)</span></h2><div class="wrap"><table><tr><th class="l">โรงพยาบาล</th><th>สถานะ</th><th>Functional bed</th><th>ครองเตียง</th><th>%Func</th><th>เหลือเตียง</th><th>ปิดซ่อม</th><th>Renovate</th></tr>';
  state.ov.forEach(function(o){var x=totals(o.rows);var r=x.usable>0?x.census/x.usable:0;
    h+='<tr class="click'+(state.sel===o.code?' sel':'')+'" data-c="'+o.code+'"><td class="l">'+esc(o.name)+'</td><td>'+(o.rows.length?'<span class="status s-ok">กรอกแล้ว</span>':'<span class="status s-no">ยังไม่กรอก</span>')+'</td><td>'+(o.rows.length?x.usable:'-')+'</td><td>'+(o.rows.length?x.census:'-')+'</td><td class="'+(r>1?'red':'')+'">'+(o.rows.length?pct(x.census,x.usable):'-')+'</td><td class="'+(x.remain<0?'red':'')+'">'+(o.rows.length?x.remain:'-')+'</td><td>'+(o.rows.length?x.repair:'-')+'</td><td>'+(o.rows.length?x.renovate:'-')+'</td></tr>'});
  h+='</table></div><div id="detail"></div>';
  $('main').innerHTML=h;
  [].forEach.call(document.querySelectorAll('tr.click'),function(tr){tr.onclick=function(){state.sel=tr.getAttribute('data-c');renderAdmin();showDetail()}});
  if(state.sel)showDetail();
}
function trendHtml(tr){var h='<div class="trend">';tr.forEach(function(d){var v=d.rate==null?0:Math.min(d.rate,1.5);h+='<div class="c"><div class="t">'+(d.rate==null?'':(d.rate*100).toFixed(1)+'%')+'</div><div class="b" style="height:'+(v/1.5*100)+'%;'+(d.rate>1?'background:var(--red)':'')+'"></div><div class="d">'+thDate(d.date).replace(/ \d{4}$/,'')+'</div></div>'});return h+'</div>'}
function showDetail(){
  var o=state.ov.find(function(x){return x.code===state.sel});if(!o)return;
  var el=$('detail');el.innerHTML='<div class="loading">กำลังโหลด...</div>';
  call('getTrend',BOOT.token,o.code,$('date').value,14).then(function(tr){
    var rows=o.rows.slice().sort(function(a,b){return calc(b).remain-calc(a).remain});
    var p=totals(o.rows);
    var bs={};o.rows.forEach(function(r){bs[r.building]=1});
    var h='<h2>'+esc(o.name)+' · '+thDate($('date').value)+'</h2><div class="kpis"><div class="kpi tot"><div class="l">Total Functional bed</div><div class="v">'+p.usable+'</div><div class="l">ครองเตียง '+p.census+' · '+pct(p.census,p.usable)+'</div></div>';
    Object.keys(bs).filter(function(b){return b}).forEach(function(b,ix){var x=totals(o.rows,b);h+='<div class="kpi '+(ix%2?'ps2':'pts')+'"><div class="l">'+esc(b)+'</div><div class="v">'+x.usable+'</div><div class="l">ครองเตียง '+x.census+' · '+pct(x.census,x.usable)+'</div></div>'});
    h+='<div class="kpi cl"><div class="l">ปิดซ่อม / Renovate</div><div class="v">'+p.repair+' / '+p.renovate+'</div></div></div>';
    h+='<h2>%Functional Bed 14 วันล่าสุด</h2>'+trendHtml(tr);
    if(!rows.length){el.innerHTML=h+'<div class="loading">ยังไม่มีข้อมูลวันนี้</div>';return}
    h+='<h2>รายละเอียดราย Ward</h2><div class="wrap"><table><tr><th class="l">Ward</th><th>อาคาร</th><th>พร้อมรับ</th><th>ครองเตียง 7 น.</th><th>%Func</th><th>ปิดซ่อม</th><th>Renovate</th><th>ห้อง</th><th>เหลือเตียง</th></tr>';
    rows.forEach(function(r){var c=calc(r);h+='<tr><td class="l">'+esc(r.ward)+(r.include==='ไม่'?' <span class="badge ex">ไม่นับรวม</span>':'')+'</td><td>'+esc(r.building)+'</td><td>'+r.ready+'</td><td>'+r.census+'</td><td class="'+(c.rate>1?'red':'')+'">'+(isFinite(c.rate)?(c.rate*100).toFixed(2)+'%':'-')+'</td><td style="'+(num(r.repair)>0?'background:var(--red2)':'')+'">'+r.repair+'</td><td style="'+(num(r.renovate)>0?'background:var(--red2)':'')+'">'+r.renovate+'</td><td>'+esc(r.room)+'</td><td class="'+(c.remain<0?'red':'')+'">'+c.remain+'</td></tr>'});
    el.innerHTML=h+'</table></div>';
    el.scrollIntoView({behavior:'smooth'});
  }).catch(err);
}
function err(e){$('main').innerHTML='<div class="loading red">เกิดข้อผิดพลาด: '+esc(e&&e.message||e)+'</div>'}
$('main').innerHTML='<div class="loading">กำลังตรวจสอบลิงก์...</div>';
call('boot',BOOT.mode,BOOT.code,BOOT.token).then(function(b){
  BOOT.name=b.name;BOOT.today=b.today;$('date').value=b.today;
  document.title=BOOT.mode==='admin'?'Functional Beds 12 โรงพยาบาล':'กรอกข้อมูลเตียง '+b.name;
  BOOT.mode==='admin'?initAdmin():initEntry();
}).catch(function(e){$('title').textContent='เปิดลิงก์ไม่ได้';$('main').innerHTML='<div class="loading red">'+esc(e.message||e)+'<br>กรุณาใช้ลิงก์ที่ได้รับจากส่วนกลาง</div>'});
</script>
