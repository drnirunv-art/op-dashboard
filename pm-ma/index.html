<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PM MA 12 โรงพยาบาล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f6f7; --panel:#ffffff; --fg:#14262c; --muted:#5b6f76; --line:#d6e0e3;
  --accent:#0f7c9c; --accent-ink:#ffffff; --head:#ffe600; --head-ink:#1d1d00;
  --shadow:0 10px 30px rgba(20,38,44,.10);
  --ok:#92D050; --ok-ink:#173d00; --bad:#FF0000; --bad-ink:#ffffff;
  --miss:#FF9800; --miss-ink:#2b1700; --part:#FFE082; --part-ink:#3d2e00; --none:#e6ecee; --none-ink:#6a7c82; --plan:#d8ecf5; --plan-ink:#0b3a4c;
  --f-body:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --none:#22333a; --none-ink:#94a9af; --plan:#1d3d4a; --plan-ink:#cfe9f3;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --panel:#162326; --fg:#e4eef0; --muted:#94a9af; --line:#2a3b3f;
  --accent:#3fb3d3; --accent-ink:#04212a; --head:#d9c400; --none:#22333a; --none-ink:#94a9af; --plan:#1d3d4a; --plan-ink:#cfe9f3;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-bottom:14px}
header h1{margin:0;font-size:clamp(1.2rem,2.4vw,1.6rem)}
header p{margin:0;color:var(--muted);font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
select,input,textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.kpi b{display:block;font-size:1.6rem;font-family:var(--f-mono)}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--miss)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:3px;width:100%}
th{font-size:12.5px;font-weight:600;color:var(--head-ink);background:var(--head);border-radius:6px;padding:5px 6px;text-align:center}
td{border-radius:6px;padding:6px;font-size:13.5px;vertical-align:top;background:var(--bg)}
td.n{text-align:center;font-family:var(--f-mono);white-space:nowrap}
td.name{white-space:nowrap;font-weight:600;position:sticky;left:0;background:var(--panel);z-index:1}
td.name a{color:inherit;text-decoration:none} td.name a:hover{text-decoration:underline}
td small,.muted{color:var(--muted);font-size:12px}
td.name small{display:block;font-weight:400}
.s-ok{background:var(--ok);color:var(--ok-ink)} .s-bad{background:var(--bad);color:var(--bad-ink)}
.s-miss{background:var(--miss);color:var(--miss-ink)} .s-part{background:var(--part);color:var(--part-ink)}
.s-none{background:var(--none);color:var(--none-ink)}
.s-watch{background:#FFD600;color:#3d3300} .s-missing{background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);font-weight:600}
h3.sub{font-size:15px;margin:18px 0 8px} table.combo td.n{font-size:12.5px;line-height:1.35;min-width:74px} table.combo td.n small{font-size:10.5px;color:inherit;opacity:.85} table.gm th{min-width:92px;font-size:12px} .s-plan{background:var(--plan);color:var(--plan-ink)}
td.lbl{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;background:transparent}
table.pva tr.pv-bot td{padding-bottom:7px} table.pva tr.pv-top td.n{border-bottom:2px solid var(--panel)}
table.pva tbody tr.pv-top td{border-top:6px solid transparent}

<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">PM MA 12 โรงพยาบาล</h1>
      <p id="sub">ติดตามสัญญาจ้างบำรุงรักษา (MA) และการเข้า PM ของผู้รับเหมา</p>

</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx7jz8ALeHKrW5aXwYUWIjVwdh-eCfDVFIAzv302fOQBp5ttPdTuj0PbW8zjjnpuS17Jw/exec";
const HOSP = [["PT2","โรงพยาบาลพญาไท 2"],["PLC","โรงพยาบาลเปาโล โชคชัย 4"],["PLD","โรงพยาบาลเปาโล พระประแดง"],["PLK","โรงพยาบาลเปาโล เกษตร"],["PLR","โรงพยาบาลเปาโล รังสิต"],["PLS","โรงพยาบาลเปาโล สมุทรปราการ"],["PT1","โรงพยาบาลพญาไท 1"],["PT3","โรงพยาบาลพญาไท 3"],["PTN","โรงพยาบาลพญาไท นวมินทร์"],["PTP","โรงพยาบาลพญาไท พหลโยธิน"],["PTS","โรงพยาบาลพญาไท ศรีราชา"],["PTW","โรงพยาบาลพญาไท บ่อวิน"]];
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const qs = new URLSearchParams(location.search);
const CODE = (qs.get("p") || "").toUpperCase();
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thd = s => { if (!s) return "-"; const [y,m,d] = s.split("-"); return `${+d}/${+m}/${+y+543}`; };
const nowM = new Date().getMonth();

async function api(params){
  if (API_URL.startsWith("PASTE")) throw new Error("ยังไม่ได้ใส่ลิงก์ Web app ของ Apps Script");
  const r = await fetch(API_URL + "?" + new URLSearchParams(params), { credentials: "omit" });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}
async function post(fn, data){
  const r = await fetch(API_URL, { method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ fn, t: TOKEN, code: CODE, data }) });
  const d = await r.json(); if (d.error) throw new Error(d.error); return d;
}

/* ---------- เลือกโรง ---------- */
$("hosp").innerHTML = `<option value="">ภาพรวม 12 โรง</option>` + HOSP.map(([c,n]) => `<option value="${c}" ${c===CODE?"selected":""}>${n}</option>`).join("");
$("hosp").onchange = e => { const u = new URL(location.href); e.target.value ? u.searchParams.set("p", e.target.value.toLowerCase()) : u.searchParams.delete("p"); u.hash = TOKEN && e.target.value === CODE ? location.hash : ""; location.href = u.toString(); };

const statusCls = s => ({"ยังมีผล":"s-ok","ใกล้หมด":"s-miss","หมดอายุแล้ว":"s-bad","ยังไม่มีวันที่":"s-none","ยกเลิก":"s-none"}[s] || "s-none");
function dayTxt(c){ if (c.daysLeft == null) return "-"; return c.daysLeft < 0 ? `เกิน ${-c.daysLeft} วัน` : `${c.daysLeft} วัน`; }

/* ---------- ภาพรวม 12 โรง ---------- */
async function overview(){
  const d = await api({ api: "summary" });
  const H = d.hospitals, sum = k => H.reduce((a,h) => a + (h[k]||0), 0);
  const plannedM = H.reduce((a,h) => a + (h.planned ? h.planned[nowM] : 0), 0);
  const visitM = H.reduce((a,h) => a + ((h.done || [])[nowM] || 0), 0);
  $("app").innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${sum("contracts")}</b><span>สัญญา MA ทั้งหมด</span></div>
      <div class="kpi warn"><b>${sum("renew")}</b><span>รอต่อสัญญา (≤90 วัน / หมดแล้วยังไม่ PO)</span></div>
      <div class="kpi bad"><b>${sum("expired")}</b><span>สัญญาหมดอายุแล้ว</span></div>
      <div class="kpi warn"><b>${sum("overdue")}</b><span>ผู้รับเหมาขาดรอบ PM</span></div>
      <div class="kpi"><b>${visitM} / ${plannedM.toLocaleString()}</b><span>เครื่องที่ทำ PM เดือนนี้ / แผนตาม Master plan</span></div>
    </div>
    <div class="card">
      <h2>แดชบอร์ดแยกกลุ่มงาน MA ปี ${d.year}</h2>
      <div class="tabs" id="gtabs"></div>
      <div id="gdesc" class="muted" style="margin:-6px 0 10px"></div>
      <div id="gmatrix"></div>
      <h3 class="sub">แผนเทียบผลจริงรายเดือน (นับเป็นจำนวนสัญญา)</h3>
      <div class="legend"><span><i style="--c:var(--plan)"></i>แผน: สัญญาที่ต้องเข้า PM ในเดือนนั้น</span><span><i style="--c:var(--ok)"></i>เข้าครบตามแผน</span><span><i style="--c:#FFD600"></i>เฝ้าระวัง: มี PO และเข้าจริง แต่ไม่ตรงเดือน</span><span><i style="--c:var(--bad)"></i>ไม่ได้เข้าตามแผน</span><span><i style="--c:var(--none)"></i>ยังไม่ถึง / ไม่มีแผน</span><span>✓ ผู้รับเหมายืนยันนัดแล้ว · ⏳ รอตอบ · ⚠ ขอเลื่อน/ไม่เข้า</span></div>
      <div class="tscroll" id="pva"><div class="loading">กำลังโหลดข้อมูลสัญญา 12 โรง…</div></div>
      <p class="foot">ชี้ที่ช่องเพื่อดูรายชื่อสัญญา · แผนคำนวณจากวันเริ่มสัญญาและรอบเข้า PM ในทะเบียนสัญญา · ผลจริงจากการบันทึกการเข้า PM</p>
    </div>
    <div class="card">
      <h2>สถานะสัญญา MA รายโรง</h2>
      <div class="tscroll"><table><thead><tr><th>โรงพยาบาล</th><th>สัญญาทั้งหมด</th><th>ยังมีผล</th><th>ใกล้หมด ≤90 วัน</th><th>หมดอายุแล้ว</th><th>ยังไม่มีวันที่</th><th>รอต่อสัญญา</th><th>ขาดรอบ PM</th></tr></thead><tbody>
      ${H.map(h => `<tr><td class="name"><a href="?p=${h.code.toLowerCase()}">${esc(h.name)}</a></td><td class="n">${h.contracts}</td><td class="n ${h.active?"s-ok":""}">${h.active}</td><td class="n ${h.soon?"s-miss":""}">${h.soon}</td><td class="n ${h.expired?"s-bad":""}">${h.expired}</td><td class="n ${h.noDate?"s-none":""}">${h.noDate}</td><td class="n ${h.renew?"s-part":""}">${h.renew}</td><td class="n ${h.overdue?"s-miss":""}">${h.overdue}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="foot">อัปเดต ${esc(d.generated)} · ข้อมูลจากโฟลเดอร์ PM MA Master plan ใน Google Drive</p>
    </div>
    <div class="card">
      <h2>แผนงาน PM รายเดือนทั้งปี ${d.year} — 12 โรง (สัญญา / เครื่อง)</h2>
      <div class="legend" id="gridLegend"></div>
      <div class="tscroll" id="grid"></div>
    </div>
`;
  $("grid").innerHTML = `<div class="loading">กำลังโหลด…</div>`;
  groupDash(H).catch(e => { $("pva").innerHTML = `<div class="msg err">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`; });
}

/* ---------- แผน vs ผลจริง (ระดับสัญญา) ---------- */
const IV = { M:1, "1M":1, "2M":2, Q:3, "3M":3, "4M":4, S:6, "6M":6, Y:12, "12M":12 };
const ymd = s => { if (!s) return null; const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return y ? new Date(y, (m||1)-1, d||1) : null; };
function pvaHospital(cs, Y){
  const plan = MONTHS.map(() => []), act = MONTHS.map(() => new Set()), st = MONTHS.map(() => ({ ok:[], watch:[], miss:[], wait:[] }));
  cs.forEach(c => {
    if (c.status === "ยกเลิก") return;
    const name = c.sys + (c.scope ? " — " + c.scope : "") + (c.vendor ? " (" + c.vendor + ")" : "");
    const vm = new Set((c.visits || []).map(v => ymd(v.date)).filter(d => d && d.getFullYear() === Y).map(d => d.getMonth()));
    vm.forEach(m => act[m].add(name));
    const iv = IV[String(c.freq || "").toUpperCase()]; if (!iv) return;
    let s = ymd(c.start), e = ymd(c.end);
    if (!s && e) s = new Date(e.getFullYear() - 1, e.getMonth(), e.getDate() + 1);
    if (!s) return;
    if (!e) e = new Date(s.getFullYear() + 1, s.getMonth(), s.getDate() - 1);
    const hasPO = c.poDone || c.status === "ยังมีผล" || c.status === "ใกล้หมด", win = Math.max(1, Math.ceil(iv / 2));
    const pm = [];
    for (let k = 0; ; k += iv) {
      const d = new Date(s.getFullYear(), s.getMonth() + k, 1);
      if (d > e || d.getFullYear() > Y) break;
      if (d.getFullYear() === Y) pm.push(d.getMonth());
    }
    const spare = [...vm].filter(x => !pm.includes(x));   // เข้าจริงในเดือนที่ไม่มีแผน
    pm.forEach(m => {
      plan[m].push(name);
      if (vm.has(m)) return st[m].ok.push(name);
      const j = hasPO && m < nowM ? spare.findIndex(x => Math.abs(x - m) <= win) : -1;
      if (j >= 0) { spare.splice(j, 1); return st[m].watch.push(name); }
      if (m >= nowM) {
        const ym = Y + "-" + String(m + 1).padStart(2, "0"), a = (c.appts || []).find(x => x.month === ym);
        const k = !a ? "none" : /^ยืนยัน/.test(a.status) ? "conf" : /รอตอบ/.test(a.status) ? "pend" : "warn";
        st[m][k] = (st[m][k] || []).concat(name + (a ? " [" + a.status + (a.newDate ? " → " + a.newDate : "") + "]" : " [ยังไม่บันทึกนัด]"));
        return st[m].wait.push(name);
      }
      st[m].miss.push(name);
    });
  });
  return { plan, act, st };
}
/* ---------- กลุ่มงาน MA ---------- */
const INSP = "ตรวจ|ทดสอบ|สมรรถ|รับรอง|load ?bank|inspect";
const GROUPS = [
  { id:"law", name:"1. By-law ตามกฎหมาย", desc:"งานที่กฎหมายกำหนด ต้องมีครบทุกโรง (ช่องขอบแดง = ยังไม่พบสัญญา)", must:true, items:[
    ["ตรวจสอบอาคาร", /ตรวจสอบอาคาร|building inspect/i],
    ["ระบบไฟฟ้า PM ประจำปี / วิศวกรรับรอง", /pm ?ไฟฟ้า|ไฟฟ้า.*ประจำปี|ตรวจ.*ระบบไฟฟ้า|thermo ?scan|อินฟราเรด|ระบบไฟฟ้า.*วิศวกร/i],
    ["ตรวจสมรรถนะ Generator", new RegExp(`((${INSP}).*(gen|เครื่องกำเนิด))|((gen|เครื่องกำเนิด).*(${INSP}))`, "i")],
    ["ตรวจสมรรถนะ Fire pump", new RegExp(`((${INSP}).*(fire ?pump|สูบน้ำดับเพลิง))|((fire ?pump|สูบน้ำดับเพลิง).*(${INSP}))`, "i")],
    ["ล้างถังเก็บน้ำ ใต้ดิน / บนหลังคา", /ล้าง.*ถัง|ถังเก็บน้ำ|tank ?clean|roof ?tank|under ?ground/i],
    ["MA บ่อบำบัดน้ำเสีย (WWTP)", /บ่อบำบัด|บำบัดน้ำเสีย|wwtp|น้ำเสีย/i],
    ["ตรวจสอบลิฟต์", new RegExp(`(${INSP}).*(ลิฟ|lift|elevator)`, "i")],
    ["ตรวจระบบก๊าซประจำปี (เสนอเพิ่ม)", /(?<!ดับเพลิง\S*)(ก๊าซ|แก๊ส)(?!.*(fm ?200|ดับเพลิง))|lpg|\bgas\b/i],
    ["ตรวจหม้อไอน้ำ Boiler (เสนอเพิ่ม)", /boiler|หม้อไอน้ำ/i],
    ["อื่นๆ ในกลุ่มนี้", /(?!)/, true]]},
  { id:"avail", name:"2. ความพร้อมใช้เครื่องจักร (มาตรฐาน)", desc:"ไม่ได้ระบุในกฎหมาย แต่มาตรฐานกำหนดให้ทำทุกปี: ล้างแอร์ ล้าง Tube Chiller และ PM รายปีของเครื่องจักรทุกเครื่อง รวม UPS", items:[

function classify(c){

    const g = GROUPS[+m[1] - 1];
    let k = g.items.findIndex(x => x[1].test(t));
    if (k < 0) k = g.items.length - 1;
    return [g.id, k];
  }
  for (const g of GROUPS) for (let k = 0; k < g.items.length; k++) if (g.id !== "other" && g.items[k][1].test(t)) return [g.id, k];
  return ["other", 0];
}
const RANK = { "หมดอายุแล้ว":4, "ใกล้หมด":3, "ยังไม่มีวันที่":2, "ยังมีผล":1 };

  const apCls = s => /^ยืนยัน/.test(s) ? "s-ok" : /รอตอบ/.test(s) ? "s-part" : "s-watch";
  return `<div class="card"><h2>นัดหมายเข้า PM และการยืนยันจากผู้รับเหมา (${ap.length})</h2>
    ${ap.length ? `<div class="tscroll"><table><thead><tr><th>เดือน</th><th>วันที่นัด</th><th>ผู้รับเหมา</th><th>งาน</th><th>สถานะยืนยัน</th><th>อ้างอิงอีเมล</th><th>ผู้บันทึก</th></tr></thead><tbody>${ap.map(([a,c]) => `<tr><td class="n">${MONTHS[+a.month.slice(5,7)-1]} ${+a.month.slice(0,4)+543}</td><td class="n">${thd(a.newDate || a.date)}</td><td>${esc(a.vendor || c.vendor)}${a.vendor && a.vendor !== c.vendor ? `<br><span class="pill s-part">เจ้าอื่น</span>` : ""}</td><td>${esc(c.scope)}</td><td><span class="pill ${apCls(a.status)}">${esc(a.status)}</span></td><td>${esc(a.ref||"-")}</td><td>${esc(a.by||"-")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">ยังไม่มีการบันทึกนัดหมาย</p>`}</div>
    <div class="card"><h2>ผู้รับเหมาขาดรอบ PM ตามสัญญา (${od.length})</h2>
    ${od.length ? `<div class="tscroll"><table><thead><tr><th>ผู้รับเหมา</th><th>งาน</th><th>รอบ</th><th>เข้าล่าสุด</th></tr></thead><tbody>${od.map(c => `<tr><td>${esc(c.vendor)}</td><td>${esc(c.scope)}</td><td class="n">${c.freq}</td><td class="n s-miss">${thd(c.lastVisit)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">ไม่มีผู้รับเหมาขาดรอบ</p>`}</div>
    <div class="card"><h2>บันทึกการเข้า PM ล่าสุด</h2>
    ${all.length ? `<div class="tscroll"><table><thead><tr><th>วันที่</th><th>ผู้รับเหมา</th><th>งาน</th><th>ผล</th><th>รายงาน</th></tr></thead><tbody>${all.slice(0,100).map(([v,c]) => `<tr><td class="n">${thd(v.date)}${v.onTime?`<br><small>${esc(v.onTime)}</small>`:""}</td><td>${esc(v.vendor || c.vendor)}${v.vendor && v.vendor !== c.vendor ? `<br><span class="pill s-part">เจ้าอื่น</span>` : ""}${v.tech?`<br><small>ช่าง: ${esc(v.tech)}</small>`:""}</td><td>${esc(c.scope)}${v.detail?`<br><small>${esc(v.detail)}</small>`:""}${v.sup?`<br><small>ผู้ควบคุม: ${esc(v.sup)}</small>`:""}</td><td>${esc(v.result||"-")}${v.problem?`<br><small>${esc(v.problem)}</small>`:""}${/ต้อง/.test(v.quote||"")&&!/ไม่ต้อง/.test(v.quote)?`<br><span class="pill s-watch">ต้องเสนอราคาซ่อม</span>`:""}</td><td>${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener">เปิด</a>`:"-"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">ยังไม่มีบันทึก</p>`}</div>`;
}

function planHtml(P){
  if (!P.rows.length) { $("pane").innerHTML = `<div class="card">${esc(P.note || "ยังไม่มีข้อมูล Master plan")}</div>`; return; }
  $("pane").innerHTML = `<div class="card"><h2>Master plan PM MA ปี ${P.year}</h2>
    <p class="foot">ไฟล์: ${esc(P.file)} · ${P.rows.length.toLocaleString()} เครื่อง · งานรวมทั้งปี ${P.perMonth.reduce((a,b)=>a+b,0).toLocaleString()} ครั้ง</p>
    <div class="ctrl" style="margin:8px 0"><input id="q" placeholder="ค้นหาชื่อเครื่อง รหัส ระบบ ผู้รับเหมา" style="min-width:260px"><select id="mf"><option value="">ทุกเดือน</option>${MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join("")}</select><span class="muted" id="cnt"></span></div>
    <div class="tscroll" id="pt"></div></div>`;
  const draw = () => {
    const q = $("q").value.trim().toLowerCase(), mf = $("mf").value;
    const rows = P.rows.filter(r => (!q || (r[0]+" "+r[1]+" "+r[6]+" "+r[7]+" "+r[2]).toLowerCase().includes(q)) && (mf === "" || r[5][+mf]));
    $("cnt").textContent = rows.length.toLocaleString() + " รายการ";
    $("pt").innerHTML = `<table class="plan"><thead><tr><th>เครื่อง</th><th>รหัส</th><th>ที่ตั้ง</th><th>ความถี่</th>${MONTHS.map(m=>`<th>${m}</th>`).join("")}<th>ระบบ</th><th>ผู้รับเหมา</th></tr></thead><tbody>${
      rows.slice(0,800).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc([r[2],r[3]].filter(Boolean).join(" · "))}</td><td class="m">${esc(r[4])}</td>${r[5].map((v,i)=>`<td class="m ${v?"on":""} ${i===nowM?"now":""}">${esc(v)}</td>`).join("")}<td>${esc(r[6])}</td><td>${esc(r[7])}</td></tr>`).join("")
    }</tbody></table>${rows.length > 800 ? `<p class="foot">แสดง 800 รายการแรก ใช้ช่องค้นหาเพื่อกรอง</p>` : ""}`;
  };
  $("q").oninput = draw; $("mf").onchange = draw; draw();
}

function recordHtml(C, steps, confirm){
  const live = C.filter(c => c.status !== "ยกเลิก");
  const opts = live.map((c,i) => `<option value="${i}">${esc((c.vendor||"(ไม่ระบุผู้รับเหมา)") + " — " + c.scope)}</option>`).join("");
  const today = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  let me = ""; try { me = localStorage.getItem("pmma-by") || ""; } catch(e) {}
  const CF = confirm || ["ยืนยันทางอีเมลแล้ว","ยืนยันทางโทรศัพท์/LINE","ส่งอีเมลแล้ว รอตอบ","ขอเลื่อน","แจ้งไม่เข้า"];
  $("pane").innerHTML = `<div class="forms">
    <div class="card"><h2>ก. นัดหมายและยืนยันการเข้า PM</h2><p class="muted">กรอกก่อนผู้รับเหมาเข้า เมื่อส่งอีเมลนัดหรือผู้รับเหมาตอบกลับ (บันทึกซ้ำได้ ระบบใช้รายการล่าสุด)</p>
      <label>สัญญา / ผู้รับเหมา</label><select id="aK">${opts}</select>
      <label>ผู้รับเหมาที่จะเข้า (เจ้าเดิม หรือพิมพ์ชื่อเจ้าอื่น)</label><input id="aV" list="vendors">
      <label>เดือนตามแผน</label><input id="aM" type="month" value="${today.slice(0,7)}">
      <label>วันที่นัดเข้า</label><input id="aD" type="date">
      <label>สถานะการยืนยันจากผู้รับเหมา</label><select id="aS">${CF.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
      <label>วันใหม่ (กรณีขอเลื่อน)</label><input id="aN" type="date">
      <label>อ้างอิงอีเมล (หัวข้อ / วันที่ส่ง / ลิงก์)</label><input id="aR" placeholder="เช่น RE: นัด PM ลิฟต์ พ.ย. 69 (3/11/69)">
      <label>หมายเหตุ</label><input id="aT">
      <label>ผู้บันทึก (วิศวกร / หัวหน้าช่าง)</label><input id="aB" value="${esc(me)}">
      <button class="btn" id="aSave">บันทึกนัดหมาย</button><div class="msg" id="aMsg"></div></div>
    <div class="card"><h2>ข. บันทึกผลการเข้า PM</h2><p class="muted">กรอกหลังผู้รับเหมาเข้าทำงานจริง</p>
      <label>สัญญา / ผู้รับเหมา</label><select id="vK">${opts}</select>
      <label>ผู้รับเหมาที่เข้าจริง (เจ้าเดิม หรือพิมพ์ชื่อเจ้าอื่น)</label><input id="vV" list="vendors">
      <label>วันที่เข้าจริง</label><input id="vD" type="date" value="${today}">
      <label>เข้าตรงตามนัดหรือไม่</label><select id="vO"><option>ตรงตามนัด</option><option>ไม่ตรงตามนัด</option><option>ไม่ได้นัดล่วงหน้า</option></select>
      <label>ช่างผู้รับเหมา (ชื่อหัวหน้าทีม)</label><input id="vTe">
      <label>จำนวนช่าง (คน)</label><input id="vN" inputmode="numeric">
      <label>จำนวนเครื่องที่ทำ PM ครั้งนี้</label><input id="vMa" inputmode="numeric" placeholder="ใช้เทียบกับแผนตาม Master plan">
      <label>รายการ / เครื่องที่ตรวจ</label><input id="vT" placeholder="เช่น PM ประจำเดือน ลิฟต์ No.1-3">
      <label>ผลการตรวจ</label><select id="vR"><option>ปกติ</option><option>พบปัญหา แก้ไขแล้ว</option><option>พบปัญหา รอแก้ไข</option></select>
      <label>ปัญหาที่พบ (ถ้ามี)</label><input id="vP">
      <label>ต้องเสนอราคาซ่อมเพิ่มหรือไม่</label><select id="vQ"><option>ไม่ต้อง</option><option>ต้องเสนอราคาซ่อม</option></select>
      <label>ลิงก์ Service report / รูป</label><input id="vL" type="url" placeholder="https://">
      <label>วิศวกรผู้ควบคุมงาน</label><input id="vSu">
      <label>ผู้บันทึก</label><input id="vB" value="${esc(me)}">
      <button class="btn" id="vS">บันทึกผล PM</button><div class="msg" id="vM"></div></div>
    <div class="card"><h2>ค. บันทึกขั้นตอนต่อสัญญา</h2>
      <label>สัญญา / ผู้รับเหมาเดิม</label><select id="pK">${opts}</select>
      <label>ขั้นตอน</label><select id="pS">${steps.map(s=>`<option>${s}</option>`).join("")}</select>
      <label>วันที่</label><input id="pD" type="date" value="${today}">
      <label>เลขที่เอกสาร (PR / PO / ใบเสนอราคา)</label><input id="pN">
      <label>ผู้ขาย / ผู้เสนอราคา (เจ้าเดิม หรือเจ้าใหม่)</label><input id="pV" list="vendors" placeholder="ใบเสนอราคา 3 เจ้า: บันทึกทีละเจ้า · ขั้น PO: ใส่ผู้รับเหมาที่ได้งาน">
      <label>ราคา (บาท)</label><input id="pP" inputmode="decimal">
      <label>หมายเหตุ</label><input id="pR">
      <label>ผู้บันทึก</label><input id="pB" value="${esc(me)}">
      <button class="btn" id="pSave">บันทึก</button><div class="msg" id="pM"></div>
      <p class="muted">ถ้าออก PO ให้ผู้รับเหมาเจ้าใหม่ หน้าทะเบียนสัญญาจะแสดงชื่อเจ้าใหม่ทันที แล้วควรแก้ชื่อผู้รับเหมาและวันที่สัญญาในไฟล์ทะเบียนสัญญาของโรงให้ตรง</p></div></div>
    <datalist id="vendors">${[...new Set(C.map(c => c.vendor).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  const keep = v => { try { if (v) localStorage.setItem("pmma-by", v); } catch(e) {} };
  const go = async (btn, msg, fn, data) => {
    btn.disabled = true; $(msg).className = "msg"; $(msg).textContent = "กำลังบันทึก…";
    try { await post(fn, data); keep(data.by); $(msg).className = "msg ok"; $(msg).textContent = "บันทึกแล้ว"; }
    catch(e){ $(msg).className = "msg err"; $(msg).textContent = e.message; }
    btn.disabled = false;
  };
  const nextMonth = c => (c.nextDue || "").slice(0,7);
  $("aK").onchange = () => { const c = live[$("aK").value]; $("aV").value = c.vendor || ""; if (nextMonth(c)) $("aM").value = nextMonth(c); };
  $("vK").onchange = () => { $("vV").value = live[$("vK").value].vendor || ""; };
  $("aK").onchange(); $("vK").onchange();
  $("aSave").onclick = () => { const c = live[$("aK").value]; go($("aSave"), "aMsg", "apptAdd", { key:c.key, vendor:$("aV").value || c.vendor, month:$("aM").value, date:$("aD").value, status:$("aS").value, newDate:$("aN").value, ref:$("aR").value, note:$("aT").value, by:$("aB").value }); };
  $("vS").onclick = () => { const c = live[$("vK").value]; go($("vS"), "vM", "visitAdd", { key:c.key, vendor:$("vV").value || c.vendor, date:$("vD").value, detail:$("vT").value, result:$("vR").value, link:$("vL").value, by:$("vB").value, onTime:$("vO").value, tech:$("vTe").value, techN:$("vN").value, problem:$("vP").value, quote:$("vQ").value, sup:$("vSu").value, machines:$("vMa").value }); };
  $("pSave").onclick = () => { const c = live[$("pK").value]; go($("pSave"), "pM", "procAdd", { key:c.key, vendor:c.vendor, step:$("pS").value, date:$("pD").value, doc:$("pN").value, seller:$("pV").value, price:$("pP").value, note:$("pR").value, by:$("pB").value }); };
}

(CODE ? hospital() : overview()).catch(e => { $("app").innerHTML = `<div class="card">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
